name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    name: smoke (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Движок заданий без GUI
        run: python tests/smoke_test.py
